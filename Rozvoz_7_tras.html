function isToday(s){return s.todayDate===TODAY_KEY&&s.today===true}
function toggleToday(i,j,v){let s=data[i].stops[j];s.today=!!v;s.todayDate=TODAY_KEY;save();render()}
function toggleTodayFilter(){onlyToday=!onlyToday;document.getElementById('todayFilter').classList.toggle('primary',onlyToday);render()}
function stats(){let stops=data.reduce((n,r)=>n+r.stops.length,0),done=data.reduce((n,r)=>n+r.stops.filter(s=>s.done).length,0),today=data.reduce((n,r)=>n+r.stops.filter(isToday).length,0);document.getElementById('routeCount').textContent=data.length;document.getElementById('stopCount').textContent=stops;document.getElementById('doneCount').textContent=done;document.getElementById('todayCount').textContent=today}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function render(){const root=document.getElementById('routes');root.innerHTML=data.map((r,i)=>{let done=r.stops.filter(s=>s.done).length,open=expanded.has(i),visibleStops=r.stops.map((s,j)=>({s,j})).filter(x=>!onlyToday||isToday(x.s));if(onlyToday&&!visibleStops.length)return '';return `<section class="route"><div class="routehead"><button class="expand" onclick="toggle(${i})"><h2>TRASA ${i+1} – ${esc(r.name)}</h2><small>${done}/${r.stops.length} zastávek hotovo ${open?'▴':'▾'}</small></button><div class="route-actions"><button class="btn small" title="Nahoru" onclick="moveRoute(${i},-1)">↑</button><button class="btn small" title="Dolů" onclick="moveRoute(${i},1)">↓</button><button class="btn small" onclick="editRoute(${i})">Upravit</button></div></div><div class="routebody ${open?'':'hidden'}">${visibleStops.length?visibleStops.map(({s,j})=>`<div class="stop"><input type="checkbox" title="Hotovo" ${s.done?'checked':''} onchange="toggleStop(${i},${j},this.checked)"><div class="stopmain"><div class="address ${s.done?'done':''}">${j+1}. ${esc(s.address)}</div><label class="note" style="display:block;margin-top:6px"><input type="checkbox" style="width:18px;height:18px;vertical-align:middle;accent-color:var(--green)" ${isToday(s)?'checked':''} onchange="toggleToday(${i},${j},this.checked)"> Dnes jedu</label>${s.note?`<div class="note">${esc(s.note)}</div>`:''}${s.lat!=null?`<div class="note">📍 GPS uloženo: ${Number(s.lat).toFixed(5)}, ${Number(s.lon).toFixed(5)}</div>`:''}<div class="actions"><button class="btn small" onclick="navigate(${i},${j})">Navigovat</button><button class="btn small" onclick="locate(${i},${j})">📍 Uložit moji polohu</button><button class="btn small" onclick="editStop(${i},${j})">Upravit</button><button class="btn small" onclick="moveStop(${i},${j},-1)">↑</button><button class="btn small" onclick="moveStop(${i},${j},1)">↓</button></div></div></div>`).join(''):'<div class="empty">Zatím žádné adresy.</div>'}<div class="toolbar" style="margin:10px 0 0 function toggle(i){expanded.has(i)?expanded.delete(i):expanded.add(i);render()}function toggleStop(i,j,v){data[i].stops[j].done=v;save();render()}
function modal(content){document.getElementById('dialog').innerHTML=content;document.getElementById('modal').classList.remove('hidden')}function closeModal(){document.getElementById('modal').classList.add('hidden')}
function editRoute(i){modal(`<h3>Upravit trasu ${i+1}</h3><label>Název trasy<input id="routeName" class="field" value="${esc(data[i].name)}"></label><div class="row"><button class="btn" onclick="closeModal()">Zrušit</button><button class="btn primary" onclick="saveRoute(${i})">Uložit</button></div><p><button class="btn danger" onclick="deleteRoute(${i})">Smazat trasu</button></p>`)}function saveRoute(i){data[i].name=document.getElementById('routeName').value.trim()||`Trasa ${i+1}`;save();closeModal();render()}
function deleteRoute(i){if(confirm(`Opravdu smazat trasu ${i+1} včetně všech adres?`)){data.splice(i,1);save();closeModal();render()}}

function editStop(i,j){let s=data[i].stops[j];modal(`<h3>Upravit zastávku</h3><textarea id="editAddress" class="field" rows="3">${esc(s.address)}</textarea><input id="editNote" class="field" value="${esc(s.note||'')}" placeholder="Poznámka"><div class="row"><button class="btn" onclick="closeModal()">Zrušit</button><button class="btn primary" onclick="saveStop(${i},${j})">Uložit</button></div><p><button class="btn danger" onclick="deleteStop(${i},${j})">Smazat adresu</button></p>`)}function saveStop(i,j){data[i].stops[j].address=document.getElementById('editAddress').value.trim();data[i].stops[j].note=document.getElementById('editNote').value.trim();save();closeModal();render()}function deleteStop(i,j){if(confirm('Smazat tuto adresu?')){data[i].stops.splice(j,1);save();closeModal();render()}}
function moveRoute(i,d){let n=i+d;if(n<0||n>=data.length)return;[data[i],data[n]]=[data[n],data[i]];expanded=new Set([...expanded].map(x=>x===i?n:x===n?i:x));save();render()}function moveStop(i,j,d){let n=j+d;if(n<0||n>=data[i].stops.length)return;[data[i].stops[j],data[i].stops[n]]=[data[i].stops[n],data[i].stops[j]];save();render()}
function chooseNavigation(){const opts=[['google','Google Mapy'],['apple','Apple Mapy'],['waze','Waze'],['mapy','Mapy.com']];modal(`<h3>Vyber navigaci</h3><p class="muted">Vybraná aplikace se uloží v tomto zařízení a použije se pro všechny zastávky.</p><label>Kam chceš navigovat?<select id="navChoice" class="field">${opts.map(([v,l])=>`<option value="${v}" ${navigationApp===v?'selected':''}>${l}</option>`).join('')}</select></label><div class="row"><button class="btn" onclick="closeModal()">Zrušit</button><button class="btn primary" onclick="saveNavigation()">Uložit výběr</button></div>`)}
function saveNavigation(){navigationApp=document.getElementById('navChoice').value;localStorage.setItem(NAV_KEY,navigationApp);updateNavLabel();closeModal()}

function navigate(i,j){let s=data[i].stops[j],dest=s.lat!=null?`${s.lat},${s.lon}`:s.address,encoded=encodeURIComponent(dest),url='';if(navigationApp==='apple')url='https://maps.apple.com/?daddr='+encoded+'&dirflg=d';else if(navigationApp==='waze')url='https://waze.com/ul?q='+encoded+'&navigate=yes';else if(navigationApp==='mapy')url='https://mapy.com/fnc/v1/route?end='+encoded+'&routeType=car';else url='https://www.google.com/maps/dir/?api=1&destination='+encoded+'&travelmode=driving';window.open(url,'_blank','noopener')}

function locate(i,j){if(!navigator.geolocation)return alert('Tento prohlížeč nepodporuje GPS.');if(!confirm('Povolit zaměření aktuální polohy? Stůj prosím přímo na místě zastávky.'))return;navigator.geolocation.getCurrentPosition(pos=>{data[i].stops[j].lat=pos.coords.latitude;data[i].stops[j].lon=pos.coords.longitude;save();render();alert('Poloha byla uložena.');},e=>alert('Polohu se nepodařilo získat. Zkontroluj povolení polohy a připojení. ('+e.message+')'),{enableHighAccuracy:true,timeout:20000,maximumAge:0})}
function printRoute(i){expanded=new Set([i]);render();setTimeout(()=>window.print(),100)}function printAll(){expanded=new Set(data.map((_,i)=>i));render();setTimeout(()=>window.print(),100)}function exportData(){let blob=new Blob([JSON.stringify({app:'Rozvoz – 7 tras',version:1,exportedAt:new Date().toISOString(),data},null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='rozvoz-zaloha.json';a.click();URL.revokeObjectURL(a.href)}function importData(e){let f=e.target.files[0];if(!f)return;let rd=new FileReader();rd.onload=()=>{try{let x=JSON.parse(rd.result);if(!Array.isArray(x.data))throw Error();if(confirm('Nahradit současné trasy daty ze zálohy?')){data=x.data;save();render()}}catch{alert('Soubor zálohy není platný.')}e.target.value=''};rd.readAsText(f)}
const saved=localStorage.getItem(KEY);if(saved){try{let x=JSON.parse(saved);if(Array.isArray(x)&&x.length)data=x}catch{}}data.forEach(r=>r.stops.forEach(s=>{if(typeof s==='string')Object.assign(s,{address:s,done:false,lat:null,lon:null,note:''});if(s.todayDate!==TODAY_KEY){s.today=false;s.todayDate=TODAY_KEY}}));render();save();updateNavLabel();
